<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ENGORA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="env.js"></script>
<style>
:root{--page:#F5F6F8;--screen:#FFFFFF;--ink:#16181D;--mute:#646A73;--line:#E3E5E9;--field:#F6F7F9;--chip:#EEF0F3;--green:#0E6F33;--gbg:#17B24E;--red:#B42318;--amber:#8A5A00;--blue:#1D5FA8;--btn:#1B1D22;--btnink:#fff;--dim:rgba(20,22,26,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0B0C0E;--screen:#15171B;--ink:#F2F3F5;--mute:#A0A6AE;--line:#2A2D33;--field:#1C1F24;--chip:#23262C;--green:#5FD38A;--red:#FF8A7D;--amber:#F2C25B;--blue:#8DC2FF;--btn:#F2F3F5;--btnink:#15171B;--dim:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--page:#0B0C0E;--screen:#15171B;--ink:#F2F3F5;--mute:#A0A6AE;--line:#2A2D33;--field:#1C1F24;--chip:#23262C;--green:#5FD38A;--red:#FF8A7D;--amber:#F2C25B;--blue:#8DC2FF;--btn:#F2F3F5;--btnink:#15171B;--dim:rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;line-height:1.6}
.phone{position:relative;width:min(430px,100%);height:100%;background:var(--screen);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:480px){body{align-items:center}.phone{height:min(840px,100%);border-radius:44px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(20,24,32,.16)}}
.scroll{flex:1;overflow-y:auto;padding:18px 20px 30px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.top-actions{display:flex;align-items:center;gap:8px}
h1{font-size:1.4rem;font-weight:600;margin:0}.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.name-trigger{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:inherit;line-height:inherit;cursor:inherit}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--chip);border-radius:12px;padding:4px;margin:6px 0 16px}
.seg button{border:0;background:none;height:40px;font-size:.88rem;border-radius:9px;font:inherit;font-weight:500;color:var(--mute);cursor:pointer}
.seg button[aria-selected=true]{background:var(--screen);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.alert{border:1.5px solid var(--red);color:var(--red);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer}
.grow{flex:1;min-width:0}small{color:var(--mute)}
.tag{font-size:.85rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-blue{color:var(--blue)}.t-mute{color:var(--mute)}
.subj{margin-bottom:20px}.subj h3{display:flex;justify-content:space-between;font-size:1rem;margin:0 0 6px;font-weight:600}
.topic{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;font:inherit;color:var(--ink);text-align:start;cursor:pointer;min-height:44px}
.topic span:first-child{flex:0 0 38%;font-size:.92rem;overflow-wrap:anywhere}
.bar{flex:1;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--gbg)}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:500;padding:0 4px;min-height:44px;cursor:pointer}
.backup-panel{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.backup-status{display:flex;align-items:center;gap:8px;min-height:34px;margin-bottom:10px;color:var(--mute);font-size:.88rem}
.backup-status-mark{width:7px;height:7px;flex:none;border-radius:50%;background:var(--mute)}
.backup-actions{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.backup-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;border-radius:0;background:transparent;color:var(--blue);font:inherit;font-weight:500;text-decoration:none;cursor:pointer}
.backup-link svg,.backup-reset svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.backup-actions label.backup-link{margin:0}
.backup-reset{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:0;padding:0 4px;border:0;border-radius:0;background:none;color:var(--mute);font:inherit;cursor:pointer}
.backup-reset:hover{color:var(--ink)}
.confirm-icon{display:grid;place-items:center;width:48px;height:48px;margin:4px auto 12px;border-radius:50%;background:var(--chip);color:var(--mute)}
.confirm-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.confirm-copy{max-width:330px;margin:6px auto 0;line-height:1.65}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.confirm-actions button{min-height:48px;border:1px solid var(--line);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.confirm-cancel{background:var(--chip);color:var(--ink)}
.confirm-danger{background:color-mix(in srgb,var(--red) 14%,var(--field));border-color:color-mix(in srgb,var(--red) 35%,var(--line))!important;color:var(--red)}
.cta{display:block;height:52px;padding:0 34px;border-radius:26px;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:500;cursor:pointer;margin:18px auto 0}
.cta:disabled{opacity:.4}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2F7BE0;outline-offset:2px}
.icon{background:var(--chip);border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;color:var(--ink)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px}
textarea{min-height:170px;resize:vertical}label{font-weight:500;display:block;margin-top:10px}
.dim{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .25s}.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;height:auto;will-change:transform;max-height:85vh;overflow-y:auto;overflow-x:hidden;background:var(--screen);border-radius:36px 36px 0 0;padding:14px 20px 40px;text-align:center;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:52px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 22px}
.sheet h2{font-size:1.15rem;font-weight:600;margin:12px 0 4px}.sheet p{margin:0;color:var(--mute)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.chips button,.ch{background:var(--chip);border:1.5px solid transparent;border-radius:10px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;min-height:52px;padding:8px 12px}
.chips .rate-choice{display:flex;align-items:center;justify-content:center;gap:8px}
.rate-icon{display:grid;place-items:center;width:22px;height:22px;flex:none}
.rate-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rate-easy,.rate-good,.rate-hard,.rate-lost{color:var(--mute)}
.ch{display:flex;align-items:center;gap:8px;width:100%;text-align:start;margin-top:10px}
.ch.ok{border-color:var(--green);background:var(--field);color:var(--green)}.ch.no{border-color:var(--red);background:var(--field);color:var(--red)}.ch svg{flex-shrink:0}
.fx{direction:ltr;text-align:left;background:var(--field);border-radius:8px;padding:6px 10px;margin:6px 0;font-family:ui-monospace,monospace;font-size:.88rem;overflow-x:auto}
.st{text-align:start}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:var(--field)}
.rc h3{margin:0 0 6px;font-size:1.05rem}.rc .lq{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.rc .lexp{color:var(--mute);font-size:.9rem;margin:8px 0 0}
.rc .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rc .btns button{background:var(--chip);border:0;border-radius:20px;padding:0 14px;min-height:44px;font:inherit;color:var(--ink);cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);margin:0;padding:0;border:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);background:var(--field);border-radius:16px;padding:22px 14px;margin-top:6px;cursor:pointer;font-weight:400;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--gbg);background:var(--chip)}
.drop.busy{opacity:.6}.drop b{font-weight:600;overflow-wrap:anywhere}
.vh:focus-visible+.drop{outline:3px solid #2F7BE0;outline-offset:2px}
.image-upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%;min-height:176px;padding:18px;margin-top:6px;border:2px dashed var(--line);border-radius:16px;background:var(--field);color:var(--ink);text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.image-upload:hover{border-color:var(--green);background:var(--chip)}
.image-upload.over{border-color:var(--green);background:var(--chip)}
.image-upload:active{transform:scale(.99)}
.image-upload .dz-ic{flex:none;width:46px;height:46px;margin:0;color:var(--ink);background:var(--chip)}
.image-upload-copy{display:flex;min-width:0;flex-direction:column;gap:3px}
.image-upload-copy b{font-weight:600}
.image-upload-copy small{font-size:.85rem}
label.topic-pick-label{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600}
.topic-pick-label small{padding:1px 8px;border-radius:99px;background:var(--chip);font-size:.78rem;font-weight:500}
.topic-pick{display:flex;align-items:center;gap:10px;min-height:60px;margin-top:6px;padding:7px 10px;border:1px solid var(--line);border-radius:14px;background:var(--field);transition:border-color .2s,box-shadow .2s}
.topic-pick:focus-within{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}
.topic-pick-icon{display:grid;flex:none;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--chip);color:var(--green)}
.topic-pick-icon svg{width:20px;height:20px}
.topic-pick select{flex:1;min-width:0;width:100%;margin:0;padding:9px 2px;border:0;background:transparent;color:var(--ink);appearance:none;cursor:pointer;outline:0}
.topic-pick select option{background-color:var(--screen);color:var(--ink)}
.topic-pick select option:checked{background-color:var(--chip);color:var(--ink)}
.topic-pick-chevron{display:grid;flex:none;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--chip);color:var(--mute)}
.topic-pick-chevron svg{width:16px;height:16px}
.vh:focus-visible+.image-upload{outline:3px solid #2F7BE0;outline-offset:2px}
.dz-ic{width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:1.25rem;margin-bottom:4px}
.dz-ic.ok{background:var(--gbg);color:#fff}
@media (prefers-reduced-motion:reduce){.sheet,.dim{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll" id="app"></div>
  <div class="dim" id="dim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-live="polite"></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const KEY="eos-full",THEME_KEY="eos-full-theme",STEPS=[1,3,7,14,30],$=id=>document.getElementById(id);
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const seed=()=>({name:"",subjects:[]});
const validState=data=>data&&typeof data.name==="string"&&Array.isArray(data.subjects)&&data.subjects.every(subject=>subject&&typeof subject.n==="string"&&Array.isArray(subject.t)&&subject.t.every(topic=>topic&&typeof topic.n==="string"&&(topic.m==null||(Number.isFinite(topic.m)&&topic.m>=0&&topic.m<=100))&&Number.isInteger(topic.k)&&topic.k>=0&&topic.k<=4&&(topic.due==null||Number.isFinite(topic.due))));
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!validState(S))S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));setSync("محفوظ على الجهاز")}catch(e){setSync("مساحة التخزين ممتلئة؛ نزّل نسخة احتياطية")}};
let LR=null;try{LR=JSON.parse(localStorage.getItem(KEY+"-lr"))}catch(e){}
const saveLR=()=>{try{if(LR)localStorage.setItem(KEY+"-lr",JSON.stringify(LR));else localStorage.removeItem(KEY+"-lr");setSync("محفوظ على الجهاز")}catch(e){setSync("مساحة التخزين ممتلئة؛ نزّل نسخة احتياطية")}};
let syncMsg="محفوظ على الجهاز";
const setSync=m=>{syncMsg=m;const e=document.getElementById("sync");if(e)e.textContent=m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="today",Q=null,busy="",picked=null,lectureSubject="Physics",lectureText="",problemText="",problemTopic="",problemImage=null,drawingImage=null;
const ftype=n=>/\.pdf$/i.test(n)?"PDF":/\.pptx$/i.test(n)?"PowerPoint":/\.docx$/i.test(n)?"Word":"نص";
const dropHTML=()=>picked?`<span class="dz-ic ok" aria-hidden="true">✓</span><b>${esc(picked.name)}</b><small class="t-mute">${picked.type} · ${picked.info||""}</small><small class="t-mute">اضغط لتغيير الملف</small>`:`<span class="dz-ic" aria-hidden="true">⬆</span><b>ارفع ملف المحاضرة</b><small class="t-mute">PDF · PowerPoint · Word · TXT/MD</small><small class="t-mute">اسحب الملف هنا أو اضغط للاختيار</small>`;
const all=()=>S.subjects.flatMap((s,si)=>s.t.map((t,ti)=>({s,t,si,ti})));
const stat=t=>t.m==null?["لم يبدأ","t-mute"]:t.m>=75?["ممتاز","t-green"]:t.m>=45?["متوسط","t-amber"]:["ضعيف","t-red"];
function mission(){const d=today(),p=x=>x.t.m==null?50:x.t.due<=d?-100+x.t.m:x.t.m;
  return all().filter(x=>x.t.m==null||x.t.due<=d||x.t.m<50).sort((a,b)=>p(a)-p(b)).slice(0,4)}
function kind(x){const d=today();
  if(x.t.m==null)return["تعلّم","جديد","t-blue",30];
  if(x.t.due<=d)return["مراجعة","مستحقة اليوم","t-red",25];
  return["تمارين","نقطة ضعف","t-amber",45]}
const greetingFor=now=>{const hour=now.getHours();return hour>=5&&hour<12?"صباح الخير":hour>=12&&hour<17?"نهارك سعيد":hour>=17||hour<5?"مساء الخير":"أهلًا بيك"};
const dateFor=now=>now.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
function refreshHeader(now=new Date()){const greeting=$("greeting"),date=$("app-date");if(greeting)greeting.textContent=greetingFor(now);if(date)date.textContent=dateFor(now)}
function apply(t,r,score){
  t.m=score==null?Math.max(0,Math.min(100,(t.m??30)+[-10,-5,8,15][r])):(t.m==null?score:Math.round((t.m+score)/2));
  t.k=r>=2?Math.min(t.k+1,4):0;const d=r>=2?STEPS[t.k]:1;t.due=today()+d;save();return d}
function render(){
  const m=mission(),weak=all().filter(x=>x.t.m!=null).sort((a,b)=>a.t.m-b.t.m)[0];
  const now=new Date(),date=dateFor(now);
  let h=`<div class="top"><div><h1><span id="greeting">${greetingFor(now)}</span>${S.name?`، `:" "}<bdi dir="auto"><button class="name-trigger" id="profile" aria-label="تعديل الاسم">${S.name?esc(S.name):"أضف اسمك"}</button></bdi></h1><p class="sub" id="app-date">${date}</p></div><div class="top-actions"><button class="icon" id="ai-key-btn" aria-label="مفتاح Gemini API" title="مفتاح Gemini API">🤖</button><button class="icon" id="theme" aria-label="تبديل الوضع الليلي">◐</button></div></div>
  <div class="seg" role="tablist">${[["today","النهاردة"],["map","المعرفة"],["lec","محاضرة"],["sv","مسائل"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if(tab==="today"){
    if(weak&&weak.t.m<45)h+=`<div class="alert" role="alert">⚠ أنت متأخر في: ${esc(weak.s.n)} — ${esc(weak.t.n)} (${weak.t.m}%)</div>`;
    h+=m.length?`<p class="sub">الوقت المخطط: ${m.reduce((a,x)=>a+kind(x)[3],0)} دقيقة</p>`+m.map(x=>{const[k,w,c,min]=kind(x);
      return `<button class="item" data-go="${x.si}-${x.ti}"><span class="tag ${c}">${k}</span><span class="grow"><b>${esc(x.s.n)}</b> — ${esc(x.t.n)}<br><small>${w} · ${min} دقيقة${x.t.qs?.length?" · كويز جاهز":""}</small></span><span aria-hidden="true">‹</span></button>`}).join(""):`<p>مفيش مهام لسه. أضف مادة من تبويب المعرفة أو حلّل محاضرة.</p>`;
  }else if(tab==="map"){
    h+=S.subjects.map((s,si)=>{const k=s.t.filter(t=>t.m!=null),avg=k.length?Math.round(k.reduce((a,t)=>a+t.m,0)/k.length):0;
      return `<div class="subj"><h3><span>${esc(s.n)}</span><span class="t-mute">${avg}%</span></h3>`+
      s.t.map((t,ti)=>{const[l,c]=stat(t);return `<button class="topic" data-topic="${si}-${ti}"><span>${esc(t.n)}</span><div class="bar" role="img" aria-label="${t.m??0}%"><i style="width:${t.m??0}%"></i></div><span class="tag ${c}">${l}</span></button>`}).join("")+
      `<button class="link" data-addt="${si}">+ موضوع جديد</button></div>`}).join("")+`<button class="link" data-adds>+ مادة جديدة</button><section class="backup-panel"><div class="backup-status"><span class="backup-status-mark" aria-hidden="true"></span><p id="sync" role="status" style="margin:0">${esc(syncMsg)}</p></div><div class="backup-actions"><button class="backup-link" id="exp">${ICONS.dl}<span>نسخة احتياطية</span></button><input type="file" id="imp" class="vh" accept=".json"><label class="backup-link" for="imp">${ICONS.up}<span>استرجاع نسخة</span></label><button class="backup-reset" data-reset><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg><span>مسح كل البيانات</span></button></div></section>`;
  }else if(tab==="sv"){h+=svHTML()}else{
    h+=`<p class="sub">الصق نص محاضرة، والـ AI يطلّع المواضيع والقوانين وأسئلة كويز ويضيفهم لخريطتك.</p>
    <label for="subj">المادة</label><input id="subj" value="${esc(lectureSubject)}">
    <input type="file" id="file" class="vh" accept=".pdf,.pptx,.docx,.txt,.md"><label class="drop" id="drop" for="file">${dropHTML()}</label>
    <label for="txt">أو الصق نص المحاضرة</label><textarea id="txt" placeholder="الصق نص المحاضرة هنا...">${esc(lectureText)}</textarea>
    <button class="cta" id="an">حلّل المحاضرة</button><button class="link" id="ex" style="display:block;margin:6px auto 0">جرّب بمثال</button>
    <p id="status" role="status" class="sub" style="margin-top:12px">${esc(busy)}</p><div id="lr">${lrHTML()}</div>`;
  }
  $("app").innerHTML=h;
}
let last=null,closeTimer=null;

async function resolveGeminiModel(key){

  return text}
